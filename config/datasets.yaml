# Which source feeds each signal (PRD section 6 M0, AGENTS.md section 2a).
# The runtime never downloads anything. Files come from scripts/fetch_nasa_data.py and are
# listed with sha256 in data/nasa/MANIFEST.yaml.
#
# Provenance: NASA_MEASURED | NASA_DERIVED | MEASURED_OTHER | SYNTHETIC_CALIBRATED | SYNTHETIC
# NASA_MEASURED and NASA_DERIVED come only from an active replay (below), never from a default.
# SYNTHETIC_CALIBRATED needs a `basis` that cites the NASA source of its parameters.
default_provenance: SYNTHETIC

signals:
  bmd_estimate:
    provenance: SYNTHETIC_CALIBRATED
    basis: "Loss rate 1-1.5 %/month in 0 g, NASA HRP Gravity Fields hazard page (limits.yaml bone.bmd_loss_pct_per_month_expected_0g, HRP reference rate, not a STD-3001 limit)"
  ppco2:
    provenance: SYNTHETIC_CALIBRATED
    basis: "Nominal 2.0 mmHg (OCHMO-TB-004 Rev D: ISS 24-h average at or below 3.00 mmHg since 2016; CDRA sized for 2.0-3.9 mmHg). Scrubber-degradation peaks 3.7-3.8 mmHg sit in the TB-004 headache band (2.8-4.5 mmHg)."

# Replays of bundled NASA data. Each entry must point at a file listed under its dataset in
# data/nasa/MANIFEST.yaml with a matching sha256; otherwise it is inactive and the synthetic generator is used.
#   adapter: rad      -> backend/app/datasets/rad.py (MSL/RAD dosimetry)
#   phases:           mission phases the replay feeds (others stay synthetic)
#   start:            dataset time that the scenario start (T0) maps to; the 48 h prewarm maps to the 48 h before it
#   compression:      dataset seconds per simulated second (1 = real time). Shown in the UI when != 1.
#   mode:             loop (wrap around the window) | hold
#   max_step:         an observation is the current value for this long (instrument cadence)
#   max_hold:         past max_step, or over a SUSPECT row, hold the last GOOD value this long (marked SUSPECT);
#                     after that the synthetic generator takes over
#   quality_factor:   mean <Q> published for the window; dose equivalent = RAD tissue dose x <Q> (NASA_DERIVED)
# Signals: area_dose_rate_absorbed is NASA_MEASURED (RAD E detector). area_dose_rate_equivalent,
# neutron_dose_equivalent_rate and the per-crew dose signals are NASA_DERIVED (formulas in `basis` below).
# While a synthetic SPE effect is active (fallback if rad_spe is inactive) the radiation signals are SYNTHETIC.
replays:
  - id: rad_spe
    adapter: rad
    dataset_id: msl_rad_spe_2012_03
    file: derived/msl_rad_spe_2012_03.csv
    signals: [area_dose_rate_absorbed, area_dose_rate_equivalent, neutron_dose_equivalent_rate,
              dose_rate_equivalent, dose_rate_absorbed, dose_mission]
    event: spe
    event_date: "2012-03-07"
    donki_id: "2012-03-07T01:44:00-SEP-001"
    start: "2012-03-08T00:00:00Z"
    compression: 20
    mode: hold
    max_step: 1h
    max_hold: 6h
    quality_factor: 1.17
    quality_factor_ref: "Zeitlin et al. (2013) Science 340:1080, MSL/RAD March 7, 2012 SEP peak <Q>"
  - id: rad_cruise
    adapter: rad
    dataset_id: msl_rad_cruise_2012
    file: derived/msl_rad_cruise_2012.csv
    signals: [area_dose_rate_absorbed, area_dose_rate_equivalent, neutron_dose_equivalent_rate,
              dose_rate_equivalent, dose_rate_absorbed, dose_mission]
    phases: [TRANSIT, MARS_TRANSIT, RETURN]
    start: "2012-04-12T00:00:00Z"
    compression: 1
    mode: loop
    max_step: 1h
    max_hold: 6h          # the window has one 5.9 h downlink gap (2012-04-18 22:42 UTC); GCR is steady over hours
    quality_factor: 3.82
    quality_factor_ref: "Zeitlin et al. (2013) Science 340:1080, MSL/RAD cruise mean <Q>"
  - id: rad_gale
    adapter: rad
    dataset_id: msl_rad_gale_2013
    file: derived/msl_rad_gale_2013.csv
    signals: [area_dose_rate_absorbed, area_dose_rate_equivalent, neutron_dose_equivalent_rate,
              dose_rate_equivalent, dose_rate_absorbed, dose_mission]
    phases: [MARS_SURFACE]
    start: "2013-03-25T00:00:00Z"
    compression: 1
    mode: loop
    max_step: 2h
    max_hold: 4h
    quality_factor: 3.05
    quality_factor_ref: "Hassler et al. (2014) Science 343:1244797, Gale crater mean <Q>"
  # ---- Block P: the other mission phases (P-1..P-3). Same adapter; extra keys:
  #   value_column:        CSV column holding the value (default dose_e_uGy_h)
  #   measures:            absorbed (default; equivalent = value x <Q>) | equivalent (absorbed = value / <Q>)
  #   instrument:          what the value is, for basis texts and the radiation view
  #   measured_provenance / derived_provenance: labels for the measured signal and everything computed from it
  #   saa_column:          P-1 only: 0/1 column -> saa_transit signal (the SPE rule stands down inside the SAA)
  #   neutron_fraction / neutron_note: override the phase's heuristic neutron share
  # Q choices and reference checks are in data/nasa/MANIFEST.yaml (`transform`, `reference`).
  - id: iss_leo
    adapter: rad
    dataset_id: iss_dostel1_2019_01
    file: derived/iss_dostel1_2019_01.csv
    value_column: dose_si_uGy_h
    saa_column: saa
    instrument: "ISS Columbus DOSTEL-1 absorbed dose rate in silicon (DLR DOSIS 3D, via NASA OSDR RadLab)"
    signals: [area_dose_rate_absorbed, area_dose_rate_equivalent, neutron_dose_equivalent_rate,
              dose_rate_equivalent, dose_rate_absorbed, dose_mission, saa_transit]
    phases: [LEO]
    start: "2019-01-03T00:00:00Z"
    compression: 1
    mode: loop
    max_step: 10m         # 100 s cadence outside the SAA, 20 s inside
    max_hold: 1h
    quality_factor: 2.26
    quality_factor_ref: "Berger et al. (2017) J. Space Weather Space Clim. 7:A8, DOSTEL-1 end of May 2016: 647 uSv/day / 286 uGy/day"
  - id: crater_lunar
    adapter: rad
    dataset_id: lro_crater_surface_2019_01
    file: derived/lro_crater_surface_2019_01.csv
    value_column: dose_h2o_uGy_h
    instrument: "LRO CRaTER D1+D2 dose rate in water, corrected from lunar orbit to the surface by the CRaTER team (NASA ISWA)"
    measured_provenance: NASA_DERIVED   # the surface correction is a transform (AGENTS.md section 2a)
    signals: [area_dose_rate_absorbed, area_dose_rate_equivalent, neutron_dose_equivalent_rate,
              dose_rate_equivalent, dose_rate_absorbed, dose_mission]
    phases: [LUNAR_SURFACE]   # TRANSIT (Earth-Moon) keeps the MSL/RAD cruise replay: free space, no surface correction
    start: "2019-01-03T00:00:00Z"
    compression: 1
    mode: loop
    max_step: 2h
    max_hold: 6h
    quality_factor: 3.82
    quality_factor_ref: "Zeitlin et al. (2013) Science 340:1080, MSL/RAD cruise (free-space GCR) mean <Q>; lunar albedo neutrons not included"
  - id: radnet_earth
    adapter: rad
    dataset_id: radnet_houston_2024_06
    file: derived/radnet_houston_2024_06.csv
    value_column: h_uSv_h
    measures: equivalent
    instrument: "EPA RadNet Houston TX gamma dose equivalent rate at ground level (terrestrial gamma, not space radiation)"
    measured_provenance: MEASURED_OTHER
    derived_provenance: MEASURED_OTHER   # computed from EPA data: never labelled NASA
    neutron_fraction: 0.0
    neutron_note: "Not measured: RadNet gamma detectors do not see neutrons, so no neutron share is shown (set to 0)."
    signals: [area_dose_rate_absorbed, area_dose_rate_equivalent, neutron_dose_equivalent_rate,
              dose_rate_equivalent, dose_rate_absorbed, dose_mission]
    phases: [POST_LANDING]
    start: "2024-06-03T00:00:00Z"
    compression: 1
    mode: loop
    max_step: 2h
    max_hold: 6h
    quality_factor: 1.0
    quality_factor_ref: "ICRP 60 radiation weighting factor 1 for photons"
  # R-4: comm delay. adapter horizons -> backend/app/datasets/horizons.py. The link's one-way delay in these
  # phases is the Earth-Mars light time for the simulated date (NASA_DERIVED). The scenario start date is fixed
  # (mission.yaml start_ts), so demo timing stays rehearsable. Outside the window: mission.yaml comm_delay_s.
  - id: light_time
    adapter: horizons
    dataset_id: horizons_earth_mars_2026
    file: derived/horizons_earth_mars_lt.csv
    signals: []
    phases: [MARS_TRANSIT, MARS_SURFACE, RETURN]

# R-5: space-weather context for the replayed SPE (ground console card; the ground can forward it to the crew
# through the delayed link). Every file is checked against MANIFEST.yaml like a replay; if one fails, the card
# says which source is missing instead of showing it.
space_weather:
  event_date: "2012-03-07"
  title: "Solar particle event of 7-10 March 2012"
  sep:    { dataset_id: donki_sep_2012_03,         file: derived/donki_sep_2012_03.json }
  events: { dataset_id: donki_flr_cme_2012_03,     file: derived/donki_flr_cme_2012_03.json }
  flux:   { dataset_id: omni2_proton_flux_2012_03, file: derived/omni2_proton_flux_2012_03.csv }

# P-6: reference panels. Shown in CrewDetail as context only; they never feed signals, rules or alerts.
# Aggregate only (ROADMAP 0.2 rule 4): backend/app/datasets/inspiration4.py refuses per-person columns and
# cells with fewer than 3 crew. Checked against MANIFEST.yaml like a replay.
reference_panels:
  inspiration4:
    dataset_id: osdr_inspiration4_cbc_cmp
    file: derived/inspiration4_cbc_cmp_aggregate.csv
    title: "Inspiration4 crew blood panels (CBC, CMP): pre- and post-flight"
    basis: "Aggregate of the 4 Inspiration4 crew (3-day LEO flight, Sept 2021): mean and SD per analyte and time point, from NASA OSDR OSD-569 (CBC) and OSD-575 (CMP). Reference only; AEGIS crew have no lab signals."
    timepoints: [L-92, L-44, L-3, R+1, R+45, R+82, R+194]
