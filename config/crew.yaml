    callsign: "Vega"
    name: "Elena Vance"   # synthetic
    role: CDR
    baseline: { hr_rest: 60, hrv: 62, sbp: 118, dbp: 76, body_mass: 78.0, vo2max_proxy: 46.0 }
    sleep_start_h: 22.0
    exercise_hours: [8.0, 16.0]
    exercise_adherence: 0.9
    career_dose_prior_mSv: 85
  - id: C2
    callsign: "Lyra"
    name: "Marcus Chen"   # synthetic
