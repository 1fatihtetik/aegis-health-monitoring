# Crew self-test catalog (Block T, PRD section 6 M11, ROADMAP section 0). Every test explains itself from here;
# no test text is hardcoded in a component.
# Per test: why (RIDGE hazard + HRP risk), numbered steps, normal band (limit_refs into limits.yaml, so the UI shows
# the "unverified" marker where it applies), escalation (onboard steps and the CMO first: the ground may be minutes
# away or blacked out), optional schedule (T-1) and protocol source.
# fields: what the crew enters. input_min/input_max is a typing plausibility range (rejects typos such as 980 for
# 98), NOT a medical limit; medical limits stay in limits.yaml.
# Results are Observations on the normal path (POST /api/v1/observations): UI entries are CREW_ENTERED, scripted
# results for the synthetic crew stay SYNTHETIC. No points, streaks, badges, levels or scores (user decision).
settings:
  manual_override:
    value: 30m
    source_ref: "User decision 2026-11-15 (\"taking over for 30 minutes is enough\"): a value the crew measures by hand replaces the continuous wearable stream of that crew member and signal for this long, so the rules judge the hand measurement"
  after_gravity_window:
    value: 2h
    source_ref: "Project setting (T-1): tests marked after_gravity_increase are due for this long after a gravity increase (e.g. a landing); overdue afterwards is INFO only"

tests:
  - id: headache
    title: "Headache check"
    kind: report
    entry_method: tap
    fields:
      - { signal: symptom_headache, label: "Headache right now (0 none, 1 mild, 2 moderate, 3 severe)", input_min: 0, input_max: 3, step: 1, anchors: { 0: "None", 1: "Mild", 2: "Moderate", 3: "Severe" } }
    why: "Headache is an early sign of high cabin CO2 and of low fluid intake. AEGIS compares it with heart rate and cabin CO2 to suggest the likely cause."
    hazards: [HOSTILE_CLOSED_ENV, GRAVITY_FIELDS]
    hrp_risks: [HRP-12, HRP-14, HRP-07]
    steps:
      - "Stop what you are doing for a moment"
      - "Rate the headache you feel right now: 0 none, 1 mild, 2 moderate, 3 severe"
      - "Tap the rating"
    limit_refs: [symptoms.headache_report_min]
    escalation: "Severe headache, or headache with vision changes, confusion or vomiting: stop work, tell the crew medical officer (CMO) now. The CMO informs the ground when the link allows."

  # ---- T-3: guided measurements ------------------------------------------------------------------------------------
  - id: bp_spo2
    title: "Blood pressure and oxygen check"
    kind: measurement
    entry_method: form
    fields:
      - { signal: bp_systolic, label: "Blood pressure, top number (systolic)", input_min: 60, input_max: 260, hint: "From the cuff display" }
      - { signal: bp_diastolic, label: "Blood pressure, bottom number (diastolic)", input_min: 30, input_max: 160, band_low: physiology.bp_diastolic_mmHg.min, band_high: physiology.bp_diastolic_mmHg.max }
      - { signal: spo2, label: "Blood oxygen (SpO2)", input_min: 50, input_max: 100, hint: "From the finger clip" }
    why: "In low gravity body fluids shift toward the head and the heart adapts; blood pressure and oxygen show how the heart and lungs cope with that and with the cabin air. A morning check gives a steady reference."
    hazards: [GRAVITY_FIELDS, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-03, HRP-06]
    steps:
      - "Sit or rest quietly for 5 minutes before measuring"
      - "Put the cuff on your bare upper arm, at heart level; keep the arm relaxed"
      - "Start the cuff and do not talk or move until it finishes"
      - "Put the finger clip on and wait until the SpO2 number stays steady for 10 seconds"
      - "Type the three numbers and tap Done"
    limit_refs: [physiology.bp_systolic_mmHg.min, physiology.bp_systolic_mmHg.max, physiology.bp_diastolic_mmHg.min, physiology.bp_diastolic_mmHg.max, physiology.spo2_pct_min]
    escalation: "SpO2 below the band twice in a row, or chest pain, shortness of breath or fainting: stop, sit down, tell the crew medical officer (CMO) now and check the cabin O2. The CMO informs the ground when the link allows."
    schedule: { every: 1d, at: "07:00", due_window: 3h }
    after_gravity_increase: true

  - id: temperature
    title: "Body temperature"
    kind: measurement
    entry_method: form
    fields:
      - { signal: body_temp, label: "Body temperature (oral)", input_min: 30, input_max: 43, step: 0.1 }
    why: "The immune system changes in space and germs spread easily in a closed cabin. A raised temperature is an early sign of infection or overheating."
    hazards: [HOSTILE_CLOSED_ENV, ISOLATION_CONFINEMENT]
    hrp_risks: [HRP-01, HRP-05]
    steps:
      - "Do not eat or drink for 15 minutes before measuring"
      - "Put the thermometer under your tongue and close your mouth"
      - "Wait for the beep (about 1 minute)"
      - "Type the number and tap Done"
    limit_refs: [physiology.body_temp_C.min, physiology.body_temp_C.max]
    escalation: "Temperature above the band, or feeling unwell: rest, drink fluids, tell the CMO and keep some distance from the other crew until reviewed. The CMO informs the ground when the link allows."

  - id: body_mass
    title: "Body mass"
    kind: measurement
    entry_method: form
    fields:
      - { signal: body_mass, label: "Body mass", input_min: 30, input_max: 200, step: 0.1 }
    why: "Crews often lose weight in space, and the loss adds to muscle and bone loss. A weekly number shows whether food intake keeps up with exercise."
    hazards: [GRAVITY_FIELDS, DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-07, HRP-09]
    steps:
      - "Measure before breakfast, after using the toilet"
      - "In weightlessness use the body mass device (it measures how you move on a spring, since a scale cannot weigh you); on a planet surface use the scale"
      - "Wear the same light clothing each week"
      - "Type the number and tap Done"
    escalation: "A loss of more than about 1 kg in a week, two weeks in a row: tell the CMO so food and exercise can be adjusted. There is no fixed band; the CMO reviews your own trend."
    schedule: { every: 7d, at: "08:00", due_window: 4h }

  - id: glucose
    title: "Blood sugar (finger prick)"
    kind: measurement
    entry_method: form
    fields:
      - { signal: glucose, label: "Blood glucose", input_min: 20, input_max: 600 }
    why: "Food supplies are fixed on a long mission and the body handles sugar differently in space. A finger-prick test checks for low or high blood sugar when you feel shaky, weak or unusually tired."
    hazards: [DISTANCE_FROM_EARTH, ISOLATION_CONFINEMENT]
    hrp_risks: [HRP-07]
    steps:
      - "Wash and dry your hands"
      - "Put a test strip into the meter"
      - "Prick the side of a fingertip with the lancet and touch the drop to the strip"
      - "Type the number (mg/dL) and tap Done; put the lancet in the sharps container"
    limit_refs: [metabolic.glucose_mg_dL.min, metabolic.glucose_mg_dL.max]
    escalation: "Below the band: take fast sugar now, no EVA or critical work, re-measure in 15 minutes and tell the CMO. Confusion or fainting: crewmates give sugar and call the CMO at once."

  - id: intake
    title: "Daily fluid and salt log"
    kind: measurement
    entry_method: form
    fields:
      - { signal: fluid_intake, label: "Fluid drunk today", input_min: 0, input_max: 8000, step: 50, hint: "Count every drink bag; 1 bag is usually 500 mL" }
      - { signal: sodium_intake, label: "Sodium eaten today", input_min: 0, input_max: 10000, step: 50, hint: "Add up the sodium on the food labels" }
    why: "Too little fluid makes fainting on standing (after landing) and kidney stones more likely. Salt is one of several suspected contributors to eye changes in space (SANS)."
    hazards: [GRAVITY_FIELDS, DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-07, HRP-03, HRP-10]
    steps:
      - "Count the drink bags you finished today and add any other drinks (mL)"
      - "Add up the sodium (mg) printed on today's food packages"
      - "Type both numbers and tap Done"
    limit_refs: [nutrition.fluid_intake_mL_day_min, nutrition.sodium_intake_mg_day_max]
    escalation: "Little fluid for two days, dark urine or flank pain: drink more and tell the CMO."
    schedule: { every: 1d, at: "21:00", due_window: 3h }

  # ---- T-2: reaction-time test (PVT-B) -------------------------------------------------------------------------------
  - id: pvt_b
    title: "Reaction-time test (PVT-B, 3 minutes)"
    kind: pvt
    entry_method: pvt
    fields:
      - { signal: pvt_mean_rt, label: "Mean reaction time", input_min: 100, input_max: 30000 }
      - { signal: pvt_lapses, label: "Lapses (responses slower than the lapse limit)", input_min: 0, input_max: 500 }
      - { signal: pvt_false_starts, label: "False starts", input_min: 0, input_max: 500 }
    why: "Sleep loss, long shifts and high CO2 slow reactions before you notice it yourself. This short test measures alertness the same way each time, so a slow day shows up before a critical task or an EVA."
    hazards: [ISOLATION_CONFINEMENT, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-14, HRP-12]
    steps:
      - "Sit comfortably where you will not be interrupted for 3 minutes"
      - "Tap Start and keep your eyes on the box"
      - "When the counter appears, tap the box (or press Space) as fast as you can"
      - "Do not tap before the counter appears; that counts as a false start"
      - "Keep going until the test ends by itself, then tap Save result"
    limit_refs: [cognition.pvt_lapse_ms, cognition.pvt_lapses_max]
    escalation: "Many lapses, or you feel very sleepy: do not start EVA or critical work; tell the crew commander and the CMO, rest, and repeat the test after sleep."
    protocol: "PVT-B (Basner, Mollicone and Dinges 2011, Acta Astronautica): 3 minutes, random gaps of 1-4 s, lapse = response slower than 355 ms, false start = response before the counter or faster than 100 ms. Used in NASA's Cognition test battery."
    params: { duration_s: 180, isi_min_s: 1, isi_max_s: 4, false_start_ms: 100, timeout_ms: 30000 }
    schedule: { every: 1d, at: "07:30", due_window: 3h }
    after_gravity_increase: true

  - id: pvt_b_short
    title: "Reaction-time test, demo length (30 s)"
    kind: pvt
    entry_method: pvt
    fields:
      - { signal: pvt_mean_rt, label: "Mean reaction time", input_min: 100, input_max: 30000 }
      - { signal: pvt_lapses, label: "Lapses (responses slower than the lapse limit)", input_min: 0, input_max: 500 }
      - { signal: pvt_false_starts, label: "False starts", input_min: 0, input_max: 500 }
    why: "A 30-second version of the reaction-time test for demonstrations. It shows how the test works; it is too short to judge alertness, so it never counts as the daily test."
    hazards: [ISOLATION_CONFINEMENT, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-14, HRP-12]
    steps:
      - "Tap Start and keep your eyes on the box"
      - "When the counter appears, tap the box (or press Space) as fast as you can"
      - "Do not tap before the counter appears"
      - "When it ends, tap Save result"
    limit_refs: [cognition.pvt_lapse_ms, cognition.pvt_lapses_max]
    escalation: "For a real check of alertness, take the 3-minute test."
    protocol: "Same rules as PVT-B (Basner et al. 2011), but only 30 s long."
    params: { duration_s: 30, isi_min_s: 1, isi_max_s: 4, false_start_ms: 100, timeout_ms: 30000 }
    short_mode_note: "Demo length, not the 3-minute protocol"

  # ---- T-5: 10-minute stand test ------------------------------------------------------------------------------------
  # Protocol confirmed by the supervisor 2026-11-15. The tablet sends one summary (drops, rise, pulse pressure, early
  # stop) plus the last standing reading as hand values of heart_rate / bp_*; supine readings are not sent alone.
  - id: stand_test
    title: "Stand test (10 minutes)"
    kind: stand_test
    entry_method: stand_test
    fields:
      - { signal: stand_sbp_drop, label: "Fall of the top blood pressure number on standing", input_min: -100, input_max: 150 }
      - { signal: stand_dbp_drop, label: "Fall of the bottom blood pressure number on standing", input_min: -100, input_max: 150 }
      - { signal: stand_hr_rise, label: "Heart rate rise on standing (seen on two readings in a row)", input_min: -60, input_max: 150 }
      - { signal: stand_pulse_pressure_min, label: "Smallest gap between the two blood pressure numbers while standing", input_min: 0, input_max: 200 }
      - { signal: stand_pulse_pressure_pct, label: "That gap as a share of the top number", input_min: 0, input_max: 100 }
      - { signal: stand_early_stop, label: "Stopped early because of symptoms (0 no, 1 yes)", input_min: 0, input_max: 1 }
      - { signal: stand_minutes, label: "Minutes stood", input_min: 0, input_max: 10, step: 0.1 }
      - { signal: heart_rate, label: "Heart rate (pulse)", input_min: 30, input_max: 220, hint: "From the cuff or the finger clip" }
      - { signal: bp_systolic, label: "Blood pressure, top number (systolic)", input_min: 60, input_max: 260 }
      - { signal: bp_diastolic, label: "Blood pressure, bottom number (diastolic)", input_min: 30, input_max: 160 }
    why: "After weeks in low gravity the body holds less fluid and the blood vessels react more slowly, so standing up can make you dizzy or faint. This test shows how your heart and blood pressure cope with standing before you take on standing work after a landing."
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-03, HRP-02]
    steps:
      - "Safety first: clear the floor around you and keep a seat or bunk right beside you; ask a crewmate to stay near if one is free"
      - "Put the blood pressure cuff on your upper arm and leave it on for the whole test"
      - "Lie flat and still for 5 minutes (the tablet counts down), then measure and enter your lying-down pulse and blood pressure"
      - "Stand up and lean back lightly against a wall: shoulder blades touching it, heels about 15 cm out, legs still (do not tense or shift them)"
      - "Measure and enter pulse and blood pressure when the tablet asks: at 1, 3, 5 and 10 minutes"
      - "If you feel dizzy, faint, sick, sweaty, your vision greys out or your chest hurts: tap STOP and lie down at once. Never push on to finish"
    limit_refs: [stand_test.sbp_drop_mmHg_min, stand_test.dbp_drop_mmHg_min, stand_test.hr_rise_bpm_min, stand_test.pulse_pressure_mmHg_min, stand_test.pulse_pressure_pct_min]
    escalation: "Stopped early, fainted or still dizzy after lying down: stay lying with legs raised, a crewmate calls the crew medical officer (CMO) at once. A positive result without symptoms: no ladders, driving or long standing tasks today and show the result to the CMO. The CMO informs the ground when the link allows."
    protocol: "10-minute stand test after 5 minutes lying down, readings at 1, 3, 5 and 10 minutes standing; a wall-lean version of the NASA post-flight orthostatic stress test (Lee et al. 2015, Aerosp Med Hum Perform 86(12):A54-A67) for use without a tilt table, only when there is gravity. Criteria after Freeman et al. 2011 (Clin Auton Res 21:69-72)."
    params: { supine_s: 300, stand_s: 600, min_gravity_g: 0.1, time_scale: 1 }
    checkpoints_min: [1, 3, 5, 10]
    stop_steps:
      - "Lie down flat now, on the floor or the bunk beside you"
      - "Raise your legs a little (on the seat or a bag)"
      - "Call a crewmate; they tell the crew medical officer (CMO)"
      - "Stay lying down until the dizziness has fully passed, then sit up slowly before you stand"
    after_gravity_increase: true

  - id: stand_test_short
    title: "Stand test, demo timing (1.5 minutes)"
    kind: stand_test
    entry_method: stand_test
    fields:
      - { signal: stand_sbp_drop, label: "Fall of the top blood pressure number on standing", input_min: -100, input_max: 150 }
      - { signal: stand_dbp_drop, label: "Fall of the bottom blood pressure number on standing", input_min: -100, input_max: 150 }
      - { signal: stand_hr_rise, label: "Heart rate rise on standing (seen on two readings in a row)", input_min: -60, input_max: 150 }
      - { signal: stand_pulse_pressure_min, label: "Smallest gap between the two blood pressure numbers while standing", input_min: 0, input_max: 200 }
      - { signal: stand_pulse_pressure_pct, label: "That gap as a share of the top number", input_min: 0, input_max: 100 }
      - { signal: stand_early_stop, label: "Stopped early because of symptoms (0 no, 1 yes)", input_min: 0, input_max: 1 }
      - { signal: stand_minutes, label: "Minutes stood", input_min: 0, input_max: 10, step: 0.1 }
      - { signal: heart_rate, label: "Heart rate (pulse)", input_min: 30, input_max: 220, hint: "From the cuff or the finger clip" }
      - { signal: bp_systolic, label: "Blood pressure, top number (systolic)", input_min: 60, input_max: 260 }
      - { signal: bp_diastolic, label: "Blood pressure, bottom number (diastolic)", input_min: 30, input_max: 160 }
    why: "The same stand test with every wait cut to a tenth, for demonstrations. It shows how the test works; it is too short to judge how you cope with standing, so it never counts as the real test."
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-03, HRP-02]
    steps:
      - "Keep a seat beside you"
      - "Lie still for 30 seconds, then enter your lying-down pulse and blood pressure"
      - "Stand and lean lightly against a wall; enter the readings when the tablet asks"
      - "Dizzy or faint: tap STOP and lie down at once"
    limit_refs: [stand_test.sbp_drop_mmHg_min, stand_test.dbp_drop_mmHg_min, stand_test.hr_rise_bpm_min, stand_test.pulse_pressure_mmHg_min, stand_test.pulse_pressure_pct_min]
    escalation: "For a real check, take the 10-minute stand test. Dizzy or faint at any time: lie down and tell the CMO."
    protocol: "Same steps and criteria as the stand test, every wait shortened to a tenth."
    params: { supine_s: 300, stand_s: 600, min_gravity_g: 0.1, time_scale: 0.1 }
    checkpoints_min: [1, 3, 5, 10]
    stop_steps:
      - "Lie down flat now, on the floor or the bunk beside you"
      - "Raise your legs a little (on the seat or a bag)"
      - "Call a crewmate; they tell the crew medical officer (CMO)"
      - "Stay lying down until the dizziness has fully passed, then sit up slowly before you stand"
    short_mode_note: "Demo timing, not the 10-minute stand protocol"

  # ---- T-4: questionnaires. onboard_only: the answers and the alerts they raise never leave the spacecraft. --------
  - id: kss
    title: "Sleepiness check (KSS)"
    kind: questionnaire
    entry_method: questionnaire
    onboard_only: true
    fields:
      - { signal: kss, label: "Sleepiness (Karolinska Sleepiness Scale)", input_min: 1, input_max: 9 }
    items:
      - label: "How sleepy have you felt in the last 10 minutes?"
        min: 1
        max: 9
        anchors: { 1: "Extremely alert", 3: "Alert", 5: "Neither alert nor sleepy", 7: "Sleepy, but no effort to keep awake", 9: "Very sleepy, fighting sleep" }
    score: mean
    why: "Sleep in space is often short and broken. How sleepy you feel, together with the reaction-time test, shows whether you are fit for a critical task."
    hazards: [ISOLATION_CONFINEMENT]
    hrp_risks: [HRP-14]
    steps:
      - "Think about the last 10 minutes"
      - "Tap the number that fits best"
      - "Tap Save"
    limit_refs: [questionnaire.kss_sleepy_min]
    escalation: "Very sleepy before EVA or critical work: tell the commander so the task can move; take the reaction-time test."
    protocol: "Karolinska Sleepiness Scale (Akerstedt and Gillberg 1990), 1-9."
    schedule: { every: 1d, at: "07:15", due_window: 3h }

  - id: tlx
    title: "Workload check (NASA-TLX)"
    kind: questionnaire
    entry_method: questionnaire
    onboard_only: true
    fields:
      - { signal: tlx_workload, label: "Workload (raw NASA-TLX, mean of 6)", input_min: 0, input_max: 100 }
    items:
      - { label: "Mental demand: how mentally demanding was today's work?", min: 0, max: 100, step: 5, anchors: { 0: "Very low", 100: "Very high" } }
      - { label: "Physical demand: how physically demanding was it?", min: 0, max: 100, step: 5, anchors: { 0: "Very low", 100: "Very high" } }
      - { label: "Time pressure: how hurried or rushed was the pace?", min: 0, max: 100, step: 5, anchors: { 0: "Very low", 100: "Very high" } }
      - { label: "Performance: how well did you do what you were asked to do?", min: 0, max: 100, step: 5, anchors: { 0: "Perfect", 100: "Failure" } }
      - { label: "Effort: how hard did you have to work to reach that level?", min: 0, max: 100, step: 5, anchors: { 0: "Very low", 100: "Very high" } }
      - { label: "Frustration: how irritated, stressed or annoyed were you?", min: 0, max: 100, step: 5, anchors: { 0: "Very low", 100: "Very high" } }
    score: mean
    why: "Long, busy days far from Earth wear people down. A short end-of-day workload rating helps the crew spread tasks before fatigue builds up."
    hazards: [ISOLATION_CONFINEMENT, DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-14, HRP-15]
    steps:
      - "Think about today's work as a whole"
      - "Move each of the six sliders"
      - "Tap Save"
    limit_refs: [questionnaire.tlx_workload_max]
    escalation: "Workload high several days in a row: raise it with the commander at the daily planning conference."
    protocol: "NASA Task Load Index, raw (unweighted) version (Hart and Staveland 1988; Hart 2006): mean of the 6 sub-scales, 0-100."
    schedule: { every: 1d, at: "20:00", due_window: 3h }

  - id: motion_sickness
    title: "Motion sickness check"
    kind: questionnaire
    entry_method: questionnaire
    onboard_only: true
    fields:
      - { signal: motion_sickness, label: "Motion sickness (MISC 0-10)", input_min: 0, input_max: 10 }
    items:
      - label: "How do you feel right now?"
        min: 0
        max: 10
        anchors: { 0: "No problems", 1: "Uneasy, no symptoms", 3: "Vague dizziness, warmth or headache", 5: "Clear dizziness, warmth or headache, no nausea", 6: "Slight nausea", 8: "Severe nausea", 9: "Retching", 10: "Vomiting" }
    score: mean
    why: "A gravity change confuses the balance organs, so dizziness and nausea are common in the first days after arriving or landing. Rating it helps decide when EVA or driving is safe."
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-02]
    steps:
      - "Sit still for a moment"
      - "Tap the number that matches how you feel"
      - "Tap Save"
    limit_refs: [questionnaire.motion_sickness_misc_min]
    escalation: "Nausea or vomiting: rest, sip fluids, tell the CMO about medicine; no EVA, driving or ladder work."
    protocol: "Misery Scale, MISC (Bos et al. 2005), 0-10."
    after_gravity_increase: true

  - id: mood
    title: "Mood check"
    kind: questionnaire
    entry_method: questionnaire
    onboard_only: true
    fields:
      - { signal: mood, label: "Mood (1-5)", input_min: 1, input_max: 5 }
    items:
      - label: "How has your mood been today?"
        min: 1
        max: 5
        anchors: { 1: "Very low", 2: "Low", 3: "OK", 4: "Good", 5: "Very good" }
    score: mean
    why: "Isolation, confinement and distance from home affect mood. A quick private check helps you notice a low stretch early. Your answer stays on board."
    hazards: [ISOLATION_CONFINEMENT, DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-12]
    steps:
      - "Think about today as a whole"
      - "Tap the number that fits best"
      - "Tap Save"
    limit_refs: [questionnaire.mood_low_max]
    escalation: "Low for several days, or thoughts of harming yourself: talk with the CMO in private today."
    protocol: "Single-item mood self-rating, 1-5 (project heuristic)."
    schedule: { every: 1d, at: "20:00", due_window: 3h }
