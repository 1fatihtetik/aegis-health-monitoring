# Rule definitions. Every rule must carry hazards + hrp_risks (AGENTS.md ground rule 3).
# Limits are referenced by path into limits.yaml: section.name or section.name.min|max.
rules:
  - id: env.co2.high_1h
    type: THRESHOLD
    title: "Cabin CO2 elevated (1 h mean)"
    signal: ppco2
    op: ">"
    limit_ref: environment.ppco2_mmHg_1h_max
    window: 1h
    agg: mean
    severity: CAUTION
    hazards: [HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-12, HRP-14]
    rationale: "Elevated CO2 is linked to headache and reduced cognitive performance."
    action: "Check CDRA/scrubber status; increase ventilation; monitor symptoms."
    checklist:
      - "Check the CO2 scrubber (CDRA) status panel for a fault"
      - "Turn cabin fans and module ventilation up"
      - "Ask each crew member: headache, tiredness, trouble focusing?"
      - "Recheck the CO2 reading in 30 minutes"

  - id: env.co2.critical
    type: THRESHOLD
    title: "Cabin CO2 high"
    signal: ppco2
    op: ">"
    limit_ref: environment.ppco2_mmHg_critical
    window: 10m
    agg: mean
    severity: WARNING
    hazards: [HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-12, HRP-14, HRP-08]
    rationale: "Sustained high CO2 threatens crew performance and health."
    action: "Start the CO2 removal contingency procedure; move crew to a ventilated module."
    checklist:
      - "Start the CO2 removal contingency procedure"
      - "Move crew to the best-ventilated module"
      - "Wear portable breathing gear if anyone feels unwell"
      - "Recheck CO2 every 10 minutes until it is back under the limit"

  - id: env.o2.low
    type: THRESHOLD
    title: "Cabin O2 partial pressure low"
    signal: ppo2
    op: "<"
    limit_ref: environment.ppo2_kPa_min
    window: 10m
    agg: mean
    severity: WARNING
    hazards: [HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-06]
    rationale: "Low O2 partial pressure is a hypoxia risk."
    action: "Check O2 supply and cabin pressure; prepare portable breathing apparatus."
    checklist:
      - "Check the O2 supply and the cabin pressure readout"
      - "Get the portable breathing apparatus ready"
      - "Stop heavy exercise until O2 is back to normal"
      - "Recheck O2 every 10 minutes"

  - id: physio.spo2.low
    type: THRESHOLD
    title: "Blood oxygen saturation low"
    signal: spo2
    op: "<"
    limit_ref: physiology.spo2_pct_min
    window: 5m
    agg: mean
    severity: WARNING
    hazards: [HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-06, HRP-08]
    rationale: "Indicators consistent with reduced oxygenation."
    action: "Check sensor placement; check cabin O2; recommend CMO review."
    checklist:
      - "Check the finger sensor is on properly and re-measure"
      - "Check the cabin O2 reading"
      - "Sit and rest; breathe slowly"
      - "If still low after 5 minutes, contact the crew medical officer (CMO)"

  - id: physio.hr.high
    type: THRESHOLD
    title: "Heart rate above limit"
    signal: heart_rate
    op: ">"
    limit_ref: physiology.hr_bpm.max
    window: 10m
    agg: mean
    severity: WARNING
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-03]
    rationale: "Sustained heart rate above the configured limit."
    action: "Stop exertion and rest; recommend CMO review."
    checklist:
      - "Stop exercise or heavy work now"
      - "Sit or lie down and rest for 10 minutes"
      - "Check the sensor fit and re-measure"
      - "If still high, contact the crew medical officer (CMO)"

  - id: physio.hr.low
    type: THRESHOLD
    title: "Heart rate below limit"
    signal: heart_rate
    op: "<"
    limit_ref: physiology.hr_bpm.min
    window: 10m
    agg: mean
    severity: WARNING
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-03]
    rationale: "Sustained heart rate below the configured limit."
    action: "Check the crew member and the sensor; recommend CMO review."
    checklist:
      - "Check on the crew member: are they awake and alert?"
      - "Check the sensor fit and re-measure"
      - "If they feel dizzy or faint, lie down with feet raised"
      - "Contact the crew medical officer (CMO)"

  - id: physio.temp.baseline_dev
    type: BASELINE
    title: "Skin temperature above personal baseline"
    signal: skin_temp
    op: ">"
    limit_ref: physiology.baseline_z_alert
    window: 30m
    baseline_window: 48h
    severity: CAUTION
    hazards: [HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-01, HRP-05]
    rationale: "Temperature well above this crew member's own rolling baseline."
    action: "Log symptoms; repeat the measurement; recommend CMO review."
    checklist:
      - "Re-measure temperature in 10 minutes"
      - "Ask about chills, aches, sore throat or other symptoms and log them"
      - "Drink fluids and rest"
      - "If it stays high, contact the crew medical officer (CMO)"

  - id: sleep.short_24h
    type: THRESHOLD
    title: "Short sleep in the last 24 h"
    signal: sleep_hours_24h
    op: "<"
    limit_ref: sleep.min_sleep_h_24h
    window: 10m
    agg: last
    severity: CAUTION
    hazards: [ISOLATION_CONFINEMENT]
    hrp_risks: [HRP-14]
    rationale: "Sleep loss lowers performance and builds sleep debt."
    action: "Protect the next sleep period; adjust the light schedule; review workload."
    checklist:
      - "Protect the next sleep period: no tasks scheduled into it"
      - "Dim cabin lights 1 hour before sleep; screens off"
      - "Move critical tasks to a well-rested crew member if possible"
      - "Log how rested you feel after the next sleep"

  - id: rad.spe.dose_rate
    type: THRESHOLD
    title: "Solar particle event: dose rate above SPE threshold"
    signal: area_dose_rate_equivalent
    op: ">"
    limit_ref: radiation.spe_alert_dose_rate_uSv_h
    window: 5m
    agg: mean
    # P-1: in LEO the ISS crosses the South Atlantic Anomaly every few orbits; the measured DOSTEL dose rate then
    # spikes to 500+ uGy/h for minutes. That is trapped protons, not a solar particle event, so the rule stands
    # down while the station is in (or just left) the SAA box. Outside LEO there is no saa_transit signal.
    unless:
      - { signal: saa_transit, op: ">", limit_ref: radiation.saa_transit_flag, window: 15m, agg: max }
    severity: EMERGENCY
    hazards: [RADIATION]
    hrp_risks: [HRP-17]
    rationale: "Area dose rate is far above background, consistent with a solar particle event."
    action: "All crew go to the storm shelter now."
    checklist:
      - "Go to the storm shelter"
      - "Log each crew member as sheltered (headcount)"
      - "Stop any EVA preparation"
      - "Read personal dosimeters every 15 minutes"
      - "Stay sheltered until the dose rate is back under the threshold"

  # P-1c (user decision 3B): make the SAA stand-down visible. One INFO alert per pass (the 10 min max bridges the
  # pass), auto-resolved after the station leaves the box. INFO costs no readiness points (readiness.yaml).
  - id: rad.saa.transit
    type: THRESHOLD
    title: "South Atlantic Anomaly crossing: short dose spike, not a solar event"
    signal: saa_transit
    op: ">"
    limit_ref: radiation.saa_transit_flag
    window: 10m
    agg: max
    severity: INFO
    hazards: [RADIATION]
    hrp_risks: [HRP-17]
    rationale: "The station is passing through the South Atlantic Anomaly, where trapped protons raise the dose rate for a few minutes each pass. This is expected in LEO and is not a solar particle event, so the shelter alarm stands down."
    action: "No action needed. Normal activities continue; the dose is counted in your mission total."
    checklist:
      - "Carry on with normal activities"
      - "Expect this alert to clear by itself within about 10 minutes of leaving the anomaly"
      - "If the dose rate stays high after the station leaves the anomaly, follow the solar particle event procedure"

  - id: rad.dose.24h
    type: CUMULATIVE
    title: "24 h radiation dose above limit"
    signal: dose_rate_equivalent
    op: ">"
    limit_ref: radiation.dose_24h_mSv_max
    window: 24h
    scale: 0.001
    unit: mSv
    severity: WARNING
    hazards: [RADIATION]
    hrp_risks: [HRP-17]
    rationale: "Dose accumulated in the last 24 hours is above the configured limit."
    action: "Keep time outside the shelter to a minimum; log the dose; recommend CMO review."
    checklist:
      - "Stay in the shielded area as much as possible"
      - "Postpone EVAs and work in low-shielding modules"
      - "Log personal dosimeter readings"
      - "Contact the crew medical officer (CMO) with the dose log"

  - id: cog.performance_risk
    type: COMPOUND
    title: "Cognitive performance risk (sleep loss + elevated CO2 or reaction-time lapses)"
    # T-2/T-4: PVT-B lapses or self-rated sleepiness are alternatives to elevated CO2 as the second piece of evidence.
    # The sleepiness member is redacted when the alert goes to the ground (onboard-only questionnaire).
    all: [sleep.short_24h]
    any: [env.co2.high_1h, cog.pvt.lapses, cog.sleepiness]
    severity: CAUTION
    hazards: [ISOLATION_CONFINEMENT, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-14, HRP-12]
    rationale: "Short sleep together with elevated CO2 or slowed reactions (PVT-B lapses) raises the risk of reduced cognitive performance."
    action: "Postpone critical tasks and EVA for this crew member; fix CO2 first; protect sleep."
    checklist:
      - "Postpone EVA and critical tasks for this crew member"
      - "Fix the CO2 problem first (see the CO2 checklist)"
      - "Give this crew member a protected sleep period"
      - "Have a second crew member double-check critical work"

  - id: cardio.orthostatic
    type: COMPOUND
    title: "Indicators consistent with orthostatic intolerance"
    all:
      - { signal: bp_systolic, op: "<", limit_ref: physiology.bp_systolic_mmHg.min, window: 15m, agg: mean }
      - { signal: heart_rate, op: ">", limit_ref: physiology.hr_orthostatic_bpm, window: 15m, agg: mean }
    severity: WARNING
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-03, HRP-02]
    rationale: "Low blood pressure together with a raised heart rate after a gravity transition."
    action: "Sit or lie down; fluids; avoid standing tasks; recommend CMO review."
    checklist:
      - "Sit down or lie flat with feet raised now"
      - "Drink fluids (water or electrolyte drink)"
      - "Stand up slowly, with someone nearby, only when ready"
      - "Avoid standing tasks until heart rate and blood pressure settle; contact the CMO"

  # Context-branching pair (ROADMAP section 5.1): the same symptoms point to different causes.
  # Both need a reported headache + raised resting heart rate; cabin CO2 decides the branch.
  - id: ctx.headache_tachy.co2
    type: COMPOUND
    title: "Headache + raised heart rate with elevated cabin CO2"
    context: headache_tachy
    branch: co2
    all:
      - { signal: symptom_headache, op: ">=", limit_ref: symptoms.headache_report_min, window: 15m, agg: max }
      - { signal: heart_rate, op: ">", limit_ref: physiology.hr_tachycardia_bpm, window: 15m, agg: mean }
      - env.co2.high_1h
    severity: CAUTION
    hazards: [HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-12, HRP-14]
    rationale: "Headache and a raised heart rate while cabin CO2 is above its limit: indicators consistent with a CO2 effect."
    action: "Treat the environment first: check CDRA/scrubber, increase ventilation; recheck symptoms in 30 min; recommend CMO review."
    checklist:
      - "Treat the cabin first: check the CO2 scrubber and turn ventilation up"
      - "Move to the best-ventilated module"
      - "Rest and drink fluids"
      - "Recheck headache and heart rate in 30 minutes; contact the CMO if not better"

  - id: ctx.headache_tachy.hydration
    type: COMPOUND
    title: "Headache + raised heart rate, cabin CO2 normal"
    context: headache_tachy
    branch: hydration
    all:
      - { signal: symptom_headache, op: ">=", limit_ref: symptoms.headache_report_min, window: 15m, agg: max }
      - { signal: heart_rate, op: ">", limit_ref: physiology.hr_tachycardia_bpm, window: 15m, agg: mean }
    none: [env.co2.high_1h]
    severity: CAUTION
    hazards: [GRAVITY_FIELDS, DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-03, HRP-07]
    rationale: "Headache and a raised heart rate with normal cabin CO2: indicators consistent with low fluid intake or another non-environmental cause."
    action: "Drink fluids and rest; log fluid intake; recheck in 30 min; recommend CMO review."
    checklist:
      - "Drink 500 mL of water or electrolyte drink"
      - "Rest for 30 minutes"
      - "Log how much you drank today"
      - "Recheck headache and heart rate in 30 minutes; contact the CMO if not better"

  # ---- Block T, T-3: guided hand measurements (config/selftests.yaml). Entered values are judged by the same
  # THRESHOLD rules as any other signal; entry-only signals use the newest value of the last 12 h / 36 h.
  - id: physio.bp.high
    type: THRESHOLD
    title: "Blood pressure high"
    signal: bp_systolic
    op: ">"
    limit_ref: physiology.bp_systolic_mmHg.max
    window: 15m
    agg: mean
    severity: CAUTION
    hazards: [GRAVITY_FIELDS, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-03]
    rationale: "Systolic blood pressure above the configured band."
    action: "Sit quietly for 5 minutes and re-measure; recommend CMO review if it stays high."
    checklist:
      - "Sit quietly for 5 minutes, feet flat, arm at heart level"
      - "Measure again with the same cuff"
      - "If it is still high, tell the crew medical officer (CMO)"

  - id: physio.temp.fever
    type: THRESHOLD
    title: "Body temperature high"
    signal: body_temp
    op: ">"
    limit_ref: physiology.body_temp_C.max
    window: 12h
    agg: last
    severity: CAUTION
    hazards: [HOSTILE_CLOSED_ENV, ISOLATION_CONFINEMENT]
    hrp_risks: [HRP-01, HRP-05]
    rationale: "Measured body temperature above the configured band: indicators consistent with an infection or overheating."
    action: "Rest, drink fluids, re-measure in 1 hour; recommend CMO review; limit close contact with other crew."
    checklist:
      - "Rest and drink fluids"
      - "Check the cabin temperature is in its band"
      - "Re-measure your temperature in 1 hour"
      - "Tell the CMO; keep some distance from the other crew until reviewed"

  - id: physio.temp.low
    type: THRESHOLD
    title: "Body temperature low"
    signal: body_temp
    op: "<"
    limit_ref: physiology.body_temp_C.min
    window: 12h
    agg: last
    severity: CAUTION
    hazards: [HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-06]
    rationale: "Measured body temperature below the configured band."
    action: "Check the thermometer is used correctly and re-measure; warm up; recommend CMO review."
    checklist:
      - "Re-measure (thermometer under the tongue, mouth closed, 1 minute)"
      - "Put on warm clothing; check the cabin temperature"
      - "If it is still low, tell the CMO"

  - id: metab.glucose.low
    type: THRESHOLD
    title: "Blood sugar low"
    signal: glucose
    op: "<"
    limit_ref: metabolic.glucose_mg_dL.min
    window: 12h
    agg: last
    severity: WARNING
    hazards: [DISTANCE_FROM_EARTH, ISOLATION_CONFINEMENT]
    hrp_risks: [HRP-07]
    rationale: "Measured blood glucose below the configured band: indicators consistent with low blood sugar."
    action: "Take fast sugar now (juice, glucose tablets), re-measure in 15 minutes; recommend CMO review."
    checklist:
      - "Eat or drink fast sugar now (juice or glucose tablets)"
      - "Sit down; do not do EVA or critical work"
      - "Re-measure in 15 minutes"
      - "Tell the CMO"

  - id: metab.glucose.high
    type: THRESHOLD
    title: "Blood sugar high"
    signal: glucose
    op: ">"
    limit_ref: metabolic.glucose_mg_dL.max
    window: 12h
    agg: last
    severity: CAUTION
    hazards: [DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-07]
    rationale: "Measured blood glucose above the configured band."
    action: "Note when you last ate, re-measure in 2 hours, drink water; recommend CMO review."
    checklist:
      - "Write down when and what you last ate"
      - "Drink water"
      - "Re-measure in 2 hours"
      - "If it is still high, tell the CMO"

  - id: intake.fluid.low
    type: THRESHOLD
    title: "Fluid intake low"
    signal: fluid_intake
    op: "<"
    limit_ref: nutrition.fluid_intake_mL_day_min
    window: 36h
    agg: last
    severity: CAUTION
    hazards: [GRAVITY_FIELDS, DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-07, HRP-03]
    rationale: "Logged daily fluid intake below the configured target. Low fluid intake makes fainting on standing (after a gravity increase) and kidney stones more likely."
    action: "Drink more through the day; carry a drink bag; log tomorrow's intake."
    checklist:
      - "Drink a 500 mL bag now"
      - "Keep a drink bag at your workstation"
      - "Log tomorrow's intake"

  - id: intake.sodium.high
    type: THRESHOLD
    title: "Sodium intake high"
    signal: sodium_intake
    op: ">"
    limit_ref: nutrition.sodium_intake_mg_day_max
    window: 36h
    agg: last
    severity: INFO
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-07, HRP-10]
    rationale: "Logged daily sodium intake above the configured target. A high-sodium diet is one of several suspected contributors to eye changes in space (SANS); the evidence is limited."
    action: "Choose lower-salt menu items tomorrow; keep logging."
    checklist:
      - "Pick lower-salt menu items tomorrow"
      - "Drink enough fluid through the day"
      - "Keep logging your daily intake"

  # ---- Block T, T-7: SANS watch (HRP-10). A watch, not a diagnosis: after a month below 1 g, any one of the
  # suspected, changeable contributors (cabin CO2, high sodium, low fluid) asks for an eye self-check and a CMO look.
  # Evidence for these contributors is limited, and the copy says so. T-9: a marked Amsler grid also counts in `any`.
  - id: sans.watch
    type: COMPOUND
    title: "Eye-change watch (SANS): long time in low gravity plus a possible contributor"
    all:
      - { signal: low_g_days, op: ">=", limit_ref: sans.low_g_days_min, window: 1h, agg: last }
    any:
      - { signal: ppco2, op: ">", limit_ref: sans.ppco2_mmHg_24h_mean_max, window: 24h, agg: mean }
      - intake.sodium.high
      - intake.fluid.low
      - eye.amsler.distortion
    severity: CAUTION
    hazards: [GRAVITY_FIELDS, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-10]
    rationale: "Long stays in low gravity can cause changes at the back of the eye and in vision (SANS, spaceflight associated neuro-ocular syndrome). Higher cabin CO2, salty food and drinking too little are suspected contributors, but the evidence linking them to SANS is limited. This is a watch: indicators worth an eye self-check, not a finding."
    action: "Do an eye self-check today and recommend CMO review; lower the possible contributors (CO2, salt, too little fluid). The evidence for these links is limited, so treat this as a precaution."
    checklist:
      - "Eye self-check: take the Amsler grid test on the Self-tests tab (one eye at a time; mark wavy, blurred or missing areas)"
      - "Tell the CMO about any change in vision, even small, and show them this watch"
      - "Lower what you can: drink to your daily target and pick lower-salt food"
      - "If cabin CO2 is high, follow the CO2 checklist"
      - "Remember: these links are suspected, not proven; this is a precaution, not a diagnosis"

  # ---- Block T, T-9: Amsler grid self-check. Any marked area asks for a CMO look today; it also counts as a
  # contributor in the SANS watch above.
  - id: eye.amsler.distortion
    type: THRESHOLD
    title: "Amsler grid: areas looked wavy, blurred or missing"
    signal: amsler_flag
    op: ">="
    limit_ref: eye.amsler_flag_min
    window: 7d
    agg: last
    severity: CAUTION
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-10]
    rationale: "In the last Amsler grid self-check, part of the grid looked wavy, blurred or missing to one or both eyes: indicators consistent with a change in central vision. Many causes are possible (tired eyes, a smudged screen, eye changes in space); only an eye exam can tell."
    action: "Show the marked grid to the CMO today; recommend CMO review with the onboard eye exam (OCT or fundoscope) if available. Repeat the grid check tomorrow at the same distance and light."
    checklist:
      - "Show the CMO the marked areas on the tablet today (the grid is not stored)"
      - "CMO: compare with earlier checks and do the onboard eye exam (OCT or fundoscope) if available"
      - "Repeat the Amsler grid check tomorrow, same distance, same light, usual glasses"
      - "Sudden loss of vision, a curtain over part of the view, or eye pain: tell the CMO at once"

  # ---- Block T, T-2: PVT-B reaction-time test ----------------------------------------------------------------------
  - id: cog.pvt.lapses
    type: THRESHOLD
    title: "Slowed reactions (reaction-time test lapses)"
    signal: pvt_lapses
    op: ">"
    limit_ref: cognition.pvt_lapses_max
    window: 12h
    agg: last
    severity: CAUTION
    hazards: [ISOLATION_CONFINEMENT, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-14, HRP-12]
    rationale: "Several slow responses (lapses) in the PVT-B reaction-time test: indicators consistent with fatigue or sleep loss."
    action: "Postpone critical tasks and EVA for this crew member; protect the next sleep period; repeat the test after rest."
    checklist:
      - "Postpone EVA and critical tasks for this crew member"
      - "Have a second crew member double-check critical work"
      - "Protect the next sleep period"
      - "Repeat the reaction-time test after rest"

  # ---- Block T, T-4: questionnaires. These signals are onboard only: the alerts below never reach the ground, and a
  # compound rule that uses them is sent with the questionnaire member redacted.
  - id: cog.sleepiness
    type: THRESHOLD
    title: "Feeling very sleepy (sleepiness scale)"
    signal: kss
    op: ">="
    limit_ref: questionnaire.kss_sleepy_min
    window: 12h
    agg: last
    severity: CAUTION
    hazards: [ISOLATION_CONFINEMENT]
    hrp_risks: [HRP-14]
    rationale: "Self-rated sleepiness at or above the configured level on the Karolinska Sleepiness Scale."
    action: "Avoid critical tasks until rested; take the reaction-time test; plan a sleep period."
    checklist:
      - "Avoid EVA and critical tasks until rested"
      - "Take the reaction-time test"
      - "Plan a protected sleep period"

  - id: workload.high
    type: THRESHOLD
    title: "High workload reported"
    signal: tlx_workload
    op: ">="
    limit_ref: questionnaire.tlx_workload_max
    window: 24h
    agg: last
    severity: INFO
    hazards: [ISOLATION_CONFINEMENT, DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-14, HRP-15]
    rationale: "Self-rated workload (raw NASA-TLX) at or above the configured level."
    action: "Talk with the commander about tomorrow's task list; take the scheduled breaks."
    checklist:
      - "Review tomorrow's task list with the commander"
      - "Take the scheduled breaks"
      - "Ask a crewmate to share a task if you can"

  - id: vestib.motion_sickness
    type: THRESHOLD
    title: "Motion sickness with nausea"
    signal: motion_sickness
    op: ">="
    limit_ref: questionnaire.motion_sickness_misc_min
    window: 6h
    agg: last
    severity: CAUTION
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-02]
    rationale: "Self-rated motion sickness at the nausea level, common in the first days after a gravity change."
    action: "Keep head movements slow; rest with eyes on a fixed point; ask the CMO about medicine; no EVA or driving."
    checklist:
      - "Move your head slowly; avoid fast turns"
      - "Rest and look at a fixed point"
      - "Ask the CMO about motion sickness medicine"
      - "No EVA, driving or ladder work until it settles"

  - id: psych.mood.low
    type: THRESHOLD
    title: "Low mood reported"
    signal: mood
    op: "<="
    limit_ref: questionnaire.mood_low_max
    window: 24h
    agg: last
    severity: INFO
    hazards: [ISOLATION_CONFINEMENT, DISTANCE_FROM_EARTH]
    hrp_risks: [HRP-12]
    rationale: "Self-rated mood at or below the configured level. This stays on board; only you and the onboard team see it."
    action: "Take a break, talk with someone you trust on board, and consider a private talk with the CMO."
    checklist:
      - "Take a break and do something you enjoy"
      - "Talk with someone you trust on board"
      - "Consider a private talk with the CMO"

  # ---- Block T, T-5: 10-minute stand test (config/selftests.yaml stand_test). The tablet sends a summary of the
  # supine and standing readings; the standing readings also go in as heart_rate / bp_* hand values, so
  # cardio.orthostatic judges them too. Stopping early for symptoms always counts as positive.
  - id: cardio.stand.positive
    type: COMPOUND
    title: "Stand test: indicators consistent with orthostatic intolerance"
    any:
      - { signal: stand_sbp_drop, op: ">=", limit_ref: stand_test.sbp_drop_mmHg_min, window: 12h, agg: last }
      - { signal: stand_dbp_drop, op: ">=", limit_ref: stand_test.dbp_drop_mmHg_min, window: 12h, agg: last }
      - { signal: stand_hr_rise, op: ">=", limit_ref: stand_test.hr_rise_bpm_min, window: 12h, agg: last }
      - { signal: stand_pulse_pressure_min, op: "<", limit_ref: stand_test.pulse_pressure_mmHg_min, window: 12h, agg: last }
      - { signal: stand_pulse_pressure_pct, op: "<", limit_ref: stand_test.pulse_pressure_pct_min, window: 12h, agg: last }
    severity: CAUTION
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-03, HRP-02]
    rationale: "On the stand test, blood pressure fell, heart rate rose or the pulse pressure narrowed past the configured criteria after standing up."
    action: "Avoid long standing tasks, ladders and driving today; drink fluids; repeat the stand test tomorrow; recommend CMO review."
    checklist:
      - "Avoid long standing tasks, ladders and driving today"
      - "Drink fluids (water or electrolyte drink) through the day"
      - "Stand up slowly and hold on to something for the first minute"
      - "Show the stand test result to the CMO; repeat the test tomorrow"

  - id: cardio.stand.early_stop
    type: THRESHOLD
    title: "Stand test stopped early with symptoms"
    signal: stand_early_stop
    op: ">="
    limit_ref: stand_test.early_stop_flag
    window: 12h
    agg: last
    severity: WARNING
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-03, HRP-02]
    rationale: "The crew member stopped the stand test because of dizziness or feeling faint: indicators consistent with orthostatic intolerance."
    action: "Lie flat with legs raised until it passes; fluids; no standing tasks, ladders, EVA or driving; recommend CMO review now."
    checklist:
      - "Lie flat with legs slightly raised until the symptoms pass"
      - "Drink fluids once you feel better"
      - "No standing tasks, ladders, EVA or driving until the CMO has reviewed"
      - "Tell the CMO now; stand up slowly, with someone nearby"
