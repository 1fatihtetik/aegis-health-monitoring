# Readiness scores (0-100). Transparent weighted formulas, every component is shown to the user.
# Component score: 100 at `good`, 50 at the limit from limits.yaml, linear, clamped to 0-100.
# Final score: weighted mean of components minus the penalty for each open alert on that crew member.
# `good` anchors, weights and penalties are project heuristics, not NASA values.
alert_penalty: { INFO: 0, CAUTION: 5, WARNING: 20, EMERGENCY: 100 }
kinds:
  EVA:
    hazards: [HOSTILE_CLOSED_ENV, ISOLATION_CONFINEMENT, RADIATION]
    hrp_risks: [HRP-08, HRP-14, HRP-06]
    go_min_ref: readiness.eva_go_min
    components:
      sleep:      { signal: sleep_hours_24h, window: 10m, agg: last, limit_ref: sleep.min_sleep_h_24h, good: 8.0, weight: 0.35 }
      co2:        { signal: ppco2, window: 1h, agg: mean, limit_ref: environment.ppco2_mmHg_1h_max, good: 2.0, weight: 0.25 }
      spo2:       { signal: spo2, window: 10m, agg: mean, limit_ref: physiology.spo2_pct_min, good: 97.0, weight: 0.20 }
      heart_rate: { signal: heart_rate, window: 30m, agg: mean, limit_ref: physiology.hr_bpm.max, good: 75.0, weight: 0.20 }
  COGNITIVE:
    hazards: [ISOLATION_CONFINEMENT, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-14, HRP-12]
    components:
      sleep: { signal: sleep_hours_24h, window: 10m, agg: last, limit_ref: sleep.min_sleep_h_24h, good: 8.0, weight: 0.6 }
      co2:   { signal: ppco2, window: 1h, agg: mean, limit_ref: environment.ppco2_mmHg_1h_max, good: 2.0, weight: 0.4 }
      # T-2: newest PVT-B of the last 24 h. Scores 50 when the mean response is as slow as a lapse (355 ms); good
      # (250 ms) is a project heuristic. Left out of the score until a PVT-B result exists.
      pvt:   { signal: pvt_mean_rt, window: 24h, agg: last, limit_ref: cognition.pvt_lapse_ms, good: 250.0, weight: 0.4 }
  OVERALL:
    hazards: [GRAVITY_FIELDS, ISOLATION_CONFINEMENT, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-03, HRP-14, HRP-06]
    components:
      sleep:      { signal: sleep_hours_24h, window: 10m, agg: last, limit_ref: sleep.min_sleep_h_24h, good: 8.0, weight: 0.4 }
      spo2:       { signal: spo2, window: 10m, agg: mean, limit_ref: physiology.spo2_pct_min, good: 97.0, weight: 0.3 }
      heart_rate: { signal: heart_rate, window: 30m, agg: mean, limit_ref: physiology.hr_bpm.max, good: 75.0, weight: 0.3 }
  PHYSICAL:
    hazards: [GRAVITY_FIELDS]
    hrp_risks: [HRP-11, HRP-09, HRP-03]
    components:
      bone:       { signal: bmd_estimate, window: 2d, agg: last, limit_ref: bone.bmd_pct_of_baseline_min, good: 100.0, weight: 0.4 }
      hrv:        { signal: hrv_rmssd, window: 1h, agg: mean, limit_ref: physiology.hrv_rmssd_ms_min, good: 60.0, weight: 0.3 }
      heart_rate: { signal: heart_rate, window: 30m, agg: mean, limit_ref: physiology.hr_bpm.max, good: 75.0, weight: 0.3 }
  # T-8 landing gate (Go / Hold) before a gravity increase. Weights, `good` anchors and the Go minimum are project
  # heuristics. A component with no value yet is left out (e.g. the stand test needs 0.1 g or more, so it is empty in
  # 0 g before the landing). Any open alert from `hold_rules` on that crew member means Hold whatever the score.
  # `action` and `hold_actions` are shown to the crew as plain steps (onboard first, no Earth link needed).
  LANDING:
    hazards: [GRAVITY_FIELDS, ISOLATION_CONFINEMENT, HOSTILE_CLOSED_ENV]
    hrp_risks: [HRP-03, HRP-02, HRP-14]
    go_min_ref: readiness.landing_go_min
    hold_rules: [cardio.orthostatic, cardio.stand.positive, cardio.stand.early_stop, physio.spo2.low, cog.pvt.lapses]
    components:
      pvt:      { signal: pvt_mean_rt, window: 24h, agg: last, limit_ref: cognition.pvt_lapse_ms, good: 250.0, weight: 0.25,
                  action: "Take the PVT-B reaction test (Today, or Other tests) when rested." }
      stand:    { signal: stand_hr_rise, window: 24h, agg: last, limit_ref: stand_test.hr_rise_bpm_min, good: 10.0, weight: 0.25,
                  action: "Do the stand test once gravity allows it (0.1 g or more), with a teammate nearby." }
      fluid:    { signal: fluid_intake, window: 36h, agg: last, limit_ref: nutrition.fluid_intake_mL_day_min, good: 3000.0, weight: 0.15,
                  action: "Drink to the daily fluid target and log it in the fluid form." }
      spo2:     { signal: spo2, window: 10m, agg: mean, limit_ref: physiology.spo2_pct_min, good: 97.0, weight: 0.2,
                  action: "Sit still for 5 minutes, then re-check SpO2 with the finger clip." }
      low_g:    { signal: low_g_days, window: 10m, agg: last, limit_ref: landing.low_g_days_long, good: 16.0, weight: 0.15,
                  action: "Long time below 1 g: sit or lie down after the landing and stand up slowly with help." }
    hold_actions:
      - "Tell the CMO now. The CMO decides on board; do not wait for Earth."
      - "Do the steps listed next to each low part of the score."
      - "Re-open this gate after the steps; it updates by itself."
      - "If you feel dizzy or faint at any time: lie down flat with your legs raised."
