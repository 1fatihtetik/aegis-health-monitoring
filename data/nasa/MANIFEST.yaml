  transform: 'RadLab API TSV (raw/, as downloaded) -> one row per record: UTC, absorbed
    dose rate in silicon (uGy/h, unchanged), ISS lat/lon/alt; saa = 1 inside the SAA
    box 10-80 deg W, 5-45 deg S (Berger et al. 2017). Rows without a value or position
