  reference:
    citation: 'Zhang et al. (2020) Sci. Adv. 6:eaaz1334 (non-NASA paper; reference
      check only): DOSIS 3D DOSTEL on ISS, same period as Chang''E 4 first lunar day,
      731 uSv/day (GCR 523, SAA ~208). Q from Berger et al. (2017) JSWSC 7:A8.'
    dose_equivalent_uSv_day: 731
    tolerance_uSv_day: 150
    tolerance_note: '~20%: <Q> 2.26 comes from May 2016 (higher solar activity, more
      SAA weight); Jan 2019 is near solar minimum with a larger GCR share and so a
      higher true <Q>. The published value may also average DOSTEL-1 and -2.'
    quality_factor: 2.26
    window_mean_dose_si_uGy_day: 272.9
    window_mean_dose_equivalent_uSv_day: 616.7
    window_saa_row_share: 0.168
    instrument_comparison:
      reference_uSv_day: 731
      quality_factor_applied: 2.26
      DosTel1:
        what: DLR DOSIS 3D DOSTEL-1, Columbus (bundled)
        mean_uGy_day: 272.9
        dose_equivalent_uSv_day: 617
      RAD-LAB1O3-pre:
        what: NASA ISS-RAD, US Lab (daily means only, marked preliminary by RadLab)
        records: 8
        mean_uGy_day: 277.9
        dose_equivalent_uSv_day: 628
      TEPC-SMP330-pre:
        what: NASA TEPC, Service Module (daily means only, marked preliminary by RadLab)
        records: 4
        mean_uGy_day: 475.4
        dose_equivalent_uSv_day: 1074
      DosTel2:
        what: DLR DOSIS 3D DOSTEL-2, Columbus
        records: 7263
        mean_uGy_day: 247.2
        dose_equivalent_uSv_day: 559
      TriTel-SM:
        what: Hungarian TriTel, Service Module
        records: 1152
        mean_uGy_day: 397.0
        dose_equivalent_uSv_day: 897
      absent: 'Liulin, Lidal and Timepix: no records in RadLab for 2019-01-03..10
        (their series start or end elsewhere).'
      decision: Keep DOSTEL-1. ISS-RAD (NASA) agrees with it within a few percent,
        so the gap to 731 is not a RadLab DOSTEL problem; it most likely comes from
        applying the May 2016 <Q> to a solar-minimum window. ISS-RAD is not clearly
        better, has only daily means (no SAA passes to replay) and no <Q> we could
        cite. DOSTEL-2 reads lower (other viewing direction). TriTel (Service Module,
        different shielding) misses 731 by more than DOSTEL-1 and the DOSTEL <Q> does
        not apply to it. TEPC has 4 days in the window and reads far above every other
        instrument (unit or processing unclear, marked preliminary).
