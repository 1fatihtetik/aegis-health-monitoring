description: "Solar particle event: replays the MSL/RAD measurement of the March 7-10, 2012 SPE (x20) for 6 hours."
# peak_factor/ramp_s only shape the synthetic fallback profile, used if the rad_spe replay file is missing.
phase: MARS_TRANSIT
speed: 60
events:
  - { at: 30m, type: spe, duration: 6h, params: { peak_factor: 80, ramp_s: 1200 } }
expected:
  - { rule_id: rad.spe.dose_rate, severity: EMERGENCY, within: 1h }
  - { rule_id: rad.dose.24h, severity: WARNING, within: 4h }
