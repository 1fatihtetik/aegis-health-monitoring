description: "Scripted demo (PRD section 14): normal day, sleep loss + CO2, SPE, Mars landing."
phase: MARS_TRANSIT
speed: 120
# Real-time budget: 30 s normal, ~19 s fast-forward, 60 s compound/EVA, 60 s SPE + ground,
# ~3 s fast-forward, 60 s landing. Simulation pauses at the end.
events:
  # 1. Normal evening in Mars transit (20:00-21:00), all nominal.
  - { at: 0, type: speed, params: { speed: 120 } }
  # 2. Fast-forward through a bad night for C1 and a slow CO2 rise the next day.
  - { at: 1h, type: speed, params: { speed: 3600 } }
  - { at: 1h, type: insomnia, duration: 30h, params: { crew: C1, sleep_fraction: 0.45 } }
  - { at: 10h, type: co2_ramp, duration: 11h30m, params: { rate_per_h: 0.15, max_rise: 1.7 } }
  - { at: 19h, type: speed, params: { speed: 60 } }
  # 3. Solar particle event. Ground sees it one comm delay later.
  - { at: 20h, type: spe, duration: 3h, params: { peak_factor: 80, ramp_s: 600 } }
  - { at: 21h, type: speed, params: { speed: 3600 } }
  # 4. Mars landing: gravity transition, orthostatic indicators for C3.
  - { at: 23h30m, type: phase, params: { name: MARS_SURFACE } }
  - { at: 23h30m, type: orthostatic, duration: 3h, params: { crew: C3 } }
  - { at: 23h30m, type: speed, params: { speed: 60 } }
  - { at: 24h30m, type: pause }
expected:
  - { rule_id: sleep.short_24h, crew_id: C1, severity: CAUTION, within: 10h }
  - { rule_id: cog.performance_risk, crew_id: C1, severity: CAUTION, within: 19h }
  - { rule_id: rad.spe.dose_rate, severity: EMERGENCY, within: 20h30m }
  - { rule_id: cardio.orthostatic, crew_id: C3, severity: WARNING, within: 24h30m }
